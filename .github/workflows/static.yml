# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rewrite absolute paths for GitHub Pages subpath
        run: |
          find . -type f \( -name "*.html" -o -name "*.css" \) -not -path "./.git/*" -print0 \
            | xargs -0 sed -i \
              -e 's#\(href="\)/#\1/DDS-Website/#g' \
              -e 's#\(src="\)/#\1/DDS-Website/#g' \
              -e 's#\(action="\)/#\1/DDS-Website/#g' \
              -e "s#\(url('\)/#\1/DDS-Website/#g"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4